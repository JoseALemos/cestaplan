name: CI

# ---------------------------------------------------------------------------
# Fork-safety model
# ---------------------------------------------------------------------------
# - This workflow runs on `push` (trusted branches of THIS repo) and on
#   `pull_request` (which includes PRs from forks).
# - It uses NO secrets and requests only read permissions, so a malicious fork
#   PR cannot exfiltrate credentials or write to the repo. `pull_request` (not
#   `pull_request_target`) runs in the fork's context WITHOUT repo secrets.
# - There is intentionally NO deploy job here. Deploys are handled by Railway
#   from trusted, protected branches after review (see docs/DEPLOYMENT.md 4.5).
#   Never add deploy credentials to a workflow that runs on `pull_request`.
# ---------------------------------------------------------------------------

on:
  push:
    branches: ["**"]
  pull_request:

# Least privilege: read-only token, never exposed to forks with write scope.
permissions:
  contents: read

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # -------------------------------------------------------------------------
  # Backend: lint, typecheck, tests against a real Postgres, migration drift.
  # -------------------------------------------------------------------------
  backend:
    name: backend (api + worker + engine)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cestaplan
          POSTGRES_PASSWORD: cestaplan
          POSTGRES_DB: cestaplan
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cestaplan"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # Point the app at the Postgres service container (psycopg driver URL).
      DATABASE_URL: postgresql+psycopg://cestaplan:cestaplan@localhost:5432/cestaplan
      # Keep the AI path fully disabled in CI (no OpenAI key, deterministic engine).
      DEPLOYMENT_MODE: self_hosted
      AI_BILLING_MODE: disabled
      SESSION_SECRET: ci-not-a-real-secret-just-32-bytes-long
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv (with Python 3.12)
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Typecheck (pyright)
        # pyright is heavier than ruff but the codebase is small; keep it in CI.
        run: uv run pyright

      - name: Apply migrations (create the schema the tests run against)
        # Tests connect to the Postgres service with the schema already in place; migrations
        # must be applied BEFORE pytest (the drift check stays after).
        run: uv run alembic upgrade head

      - name: Run tests (pytest)
        run: uv run pytest

      - name: Migration validation (drift check)
        # Assert models and migrations are in sync; `alembic check` exits non-zero if
        # autogenerate would emit operations.
        run: uv run alembic check

  # -------------------------------------------------------------------------
  # Frontend: lint, typecheck, production build (standalone).
  # -------------------------------------------------------------------------
  frontend:
    name: frontend (web)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.3

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (eslint)
        run: pnpm --filter @cestaplan/web lint

      - name: Typecheck (tsc)
        run: pnpm --filter @cestaplan/web typecheck

      - name: Test (node --test, native TS)
        # Pure display/format helpers; run on Node's built-in test runner (no extra framework).
        run: pnpm --filter @cestaplan/web test

      - name: Build (next, standalone)
        env:
          # The browser talks only to the same-origin proxy; the API upstream is server-only.
          NEXT_PUBLIC_API_BASE_URL: /api-proxy
          API_UPSTREAM_URL: http://localhost:8000
        run: pnpm --filter @cestaplan/web build

  # -------------------------------------------------------------------------
  # Dependency scan: advisory only (non-blocking) — surfaces CVEs without
  # gating merges on noisy transitive advisories. Tighten once triaged.
  # -------------------------------------------------------------------------
  dependency-scan:
    name: dependency scan (advisory)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv (with Python 3.12)
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Python audit (pip-audit)
        continue-on-error: true
        working-directory: apps/api
        run: |
          uv export --frozen --no-dev --format requirements-txt --no-emit-project -o requirements.txt
          uvx pip-audit -r requirements.txt

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.3

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: JS audit (pnpm audit)
        continue-on-error: true
        run: pnpm audit --audit-level high

  # -------------------------------------------------------------------------
  # Build provenance: prove the build-provenance document is reproducible and
  # correctly scoped. Uses github.sha only — no secrets, no Railway variables.
  # API and worker share ONE image (apps/api/Dockerfile), so their documents are
  # identical by construction; CI proves the image document == the repo-reproduced
  # document and that scope mutations move the right hashes.
  # -------------------------------------------------------------------------
  build-provenance:
    name: build provenance (reproducible + scoped)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv (with Python 3.12)
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        working-directory: apps/api
        run: uv sync --frozen

      - name: Toolchain pinning matches the Dockerfile (no :latest, every FROM has a digest)
        working-directory: apps/api
        run: |
          uv run python - <<'PY'
          import re
          from pathlib import Path
          from cestaplan_api.provenance import generator as g
          lines = [ln for ln in Path("Dockerfile").read_text().splitlines()
                   if not ln.lstrip().startswith("#")]
          df = "\n".join(lines)
          assert ":latest" not in df, "FAIL: a floating tag (:latest) is forbidden"
          refs = re.findall(r"^FROM\s+(\S+)", df, re.M) + re.findall(r"COPY --from=(\S+)", df)
          # image refs contain a registry/tag separator; bare words (builder/runtime) are stages.
          images = [r for r in refs if ("/" in r or ":" in r)]
          for img in images:
              assert "@sha256:" in img, f"FAIL: digest-less image reference: {img}"
          assert g.PYTHON_BASE_IMAGE_DIGEST in df, "FAIL: python base digest != generator constant"
          assert g.UV_IMAGE_DIGEST in df, "FAIL: uv image digest != generator constant"
          print("toolchain pinning OK")
          PY

      - name: Validate hashes, per-scope mutations and exclusions (unit suite)
        working-directory: apps/api
        run: uv run pytest tests/provenance -q

      - name: Emit sanitized manifests (paths + content hashes + sizes only)
        working-directory: apps/api
        run: |
          uv run python - <<'PY'
          import json
          from cestaplan_api.provenance import generator as g
          from cestaplan_api.provenance.manifest import build_manifest
          for name, inc in (("api", g.API_ARTIFACT_INCLUDES),
                            ("worker", g.WORKER_ARTIFACT_INCLUDES)):
              with open(f"/tmp/manifest-{name}.json", "w") as fh:
                  json.dump(build_manifest(".", inc), fh, sort_keys=True, indent=2)
          PY

      - name: Build the shared image (bakes the provenance document inside it)
        run: |
          docker build -f apps/api/Dockerfile \
            --build-arg BUILD_COMMIT_SHA="${{ github.sha }}" -t cestaplan-image .

      # The provenance document now pins the PostgreSQL 18 client binaries' SHA-256, which are
      # specific to the image filesystem (Debian trixie), NOT the ubuntu runner. Generation must
      # therefore run INSIDE the image. Generate twice in-image, require byte-for-byte equality,
      # and require both equal the document baked at build time.
      - name: Reproducible in-image + equals the baked document (pg SHAs are image-specific)
        run: |
          docker run --rm cestaplan-image sh -c '
            python -m cestaplan_api.provenance.generate --base /app \
              --commit-sha "'"${{ github.sha }}"'" --out /tmp/a.json --print-sha256
            python -m cestaplan_api.provenance.generate --base /app \
              --commit-sha "'"${{ github.sha }}"'" --out /tmp/b.json
            cmp /tmp/a.json /tmp/b.json
            cmp /tmp/a.json /app/build-provenance.json
            echo "provenance reproducible in-image and byte-identical to the baked document"
          '

      - name: Extract the baked document (+ its sha256) for the artifact bundle
        run: |
          cid=$(docker create cestaplan-image)
          docker cp "$cid:/app/build-provenance.json" /tmp/build-provenance.json
          docker rm "$cid"
          sha256sum /tmp/build-provenance.json | cut -d' ' -f1 \
            > /tmp/build-provenance.json.sha256

      - name: Publish the trust-root (public keys + its hash only)
        working-directory: apps/api
        run: |
          cp authorization-trust-root.json /tmp/authorization-trust-root.json
          sha256sum authorization-trust-root.json | cut -d' ' -f1 \
            > /tmp/authorization-trust-root.sha256

      - name: Upload provenance artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-provenance
          # Only the document, its hash, sanitized manifests and the PUBLIC trust-root — never a
          # package, signature or private key.
          path: |
            /tmp/build-provenance.json
            /tmp/build-provenance.json.sha256
            /tmp/manifest-api.json
            /tmp/manifest-worker.json
            /tmp/authorization-trust-root.json
            /tmp/authorization-trust-root.sha256

  # -------------------------------------------------------------------------
  # Image runtime: build the REAL image and prove /app is immutable to the app
  # user (spec §1v3) and that API + worker start as that user. No secrets.
  # -------------------------------------------------------------------------
  image-runtime:
    name: image runtime (immutable /app, app-user startup)
    runs-on: ubuntu-latest
    services:
      # PostgreSQL 18 so the functional pg_restore --list test exercises a genuine major-18 dump,
      # matching the pinned major-18 client baked into the image. Pinned by digest (readable tag
      # kept alongside) so CI is reproducible and never floats.
      postgres:
        image: postgres:18@sha256:3a82e1f56c8f0f5616a11103ac3d47e632c3938698946a7ad26da0df1334744a
        env:
          POSTGRES_USER: cestaplan
          POSTGRES_PASSWORD: cestaplan
          POSTGRES_DB: cestaplan
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cestaplan"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://cestaplan:cestaplan@localhost:5432/cestaplan
      DEPLOYMENT_MODE: self_hosted
      AI_BILLING_MODE: disabled
      SESSION_SECRET: ci-not-a-real-secret-just-32-bytes-long
    steps:
      - uses: actions/checkout@v4

      - name: Build the image
        run: docker build -f apps/api/Dockerfile
             --build-arg BUILD_COMMIT_SHA="${{ github.sha }}" -t cestaplan-image .

      - name: /app is immutable to the app user (§1v3) + build inputs covered (§4v4)
        run: |
          docker run --rm cestaplan-image python - <<'PY'
          import os, sys
          from cestaplan_api.provenance import generator as g
          from cestaplan_api.provenance.manifest import build_manifest
          def cannot_write(p):
              try:
                  open(p, "a").close(); return False
              except OSError:
                  return True
          def cannot_delete(p):
              try:
                  os.remove(p); return False
              except OSError:
                  return True
          def cannot_rename(p):
              try:
                  os.rename(p, p + ".x"); return False
              except OSError:
                  return True
          bp, tr, code = ("/app/build-provenance.json", "/app/authorization-trust-root.json",
                          "/app/src/cestaplan_api/main.py")
          manifest_paths = {e["path"] for e in build_manifest("/app", g.SOURCE_TREE_INCLUDES)}
          checks = {
              "provenance_no_modify": cannot_write(bp), "provenance_no_delete": cannot_delete(bp),
              "provenance_no_rename": cannot_rename(bp),
              "trust_no_modify": cannot_write(tr), "trust_no_delete": cannot_delete(tr),
              "trust_no_rename": cannot_rename(tr), "code_no_modify": cannot_write(code),
              # §4v4: the image bakes ONLY the document (no .sha256 sidecar), and README.md — a build
              # input for uv — is measured by the provenance scopes.
              "provenance_exists": os.path.isfile(bp),
              "sha256_sidecar_absent": not os.path.exists(bp + ".sha256"),
              "readme_covered": "README.md" in manifest_paths}
          try:
              t = "/tmp/permtest"; open(t, "w").write("x"); os.remove(t); tmp_ok = True
          except OSError:
              tmp_ok = False
          print("uid", os.getuid(), checks, "tmp_ok", tmp_ok)
          sys.exit(0 if all(checks.values()) and tmp_ok else 1)
          PY

      - name: PostgreSQL 18 client present, pinned, and matches the provenance (§3/§5/§7)
        run: |
          docker run --rm cestaplan-image python - <<'PY'
          import hashlib, json, os, shutil, subprocess, sys
          BIN = "/usr/lib/postgresql/18/bin"
          doc = json.load(open("/app/build-provenance.json"))
          def sha(p):
              h = hashlib.sha256()
              with open(p, "rb") as fh:
                  for chunk in iter(lambda: fh.read(1 << 20), b""):
                      h.update(chunk)
              return h.hexdigest()
          def major(binp):
              out = subprocess.run([binp, "--version"], capture_output=True, text=True,
                                   check=True).stdout
              return out.split("PostgreSQL)")[-1].strip().split(".")[0].split()[0]
          pgr, pgd = f"{BIN}/pg_restore", f"{BIN}/pg_dump"
          # dpkg-recorded package version of the pinned client.
          pkgver = subprocess.run(["dpkg-query", "-W", "-f", "${Version}", "postgresql-client-18"],
                                  capture_output=True, text=True, check=True).stdout.strip()
          # Every documented runtime library (postgresql_runtime_files) must exist on disk with the
          # EXACT documented sha256 — the closure the provenance measured is the closure that ships.
          libs_ok = all(sha(fe["path"]) == fe["sha256"] for fe in doc["postgresql_runtime_files"])
          # The manifest hash recorded in the document is the canonical hash over deps + files.
          from cestaplan_api.provenance import generator as g
          manifest_ok = doc["postgresql_runtime_manifest_hash"] == g._pg_runtime_manifest_hash(
              {"postgresql_runtime_dependencies": doc["postgresql_runtime_dependencies"],
               "postgresql_runtime_files": doc["postgresql_runtime_files"]})
          checks = {
              "schema_version_4": doc["schema_version"] == 4,
              "pg_restore_present": os.path.isfile(pgr),
              "pg_dump_present": os.path.isfile(pgd),
              # PATH resolves pg_restore to the pinned major-18 dir (no wrapper / implicit select).
              "path_pinned_restore": shutil.which("pg_restore") == pgr,
              "path_pinned_dump": shutil.which("pg_dump") == pgd,
              "restore_major_18": major(pgr) == "18",
              "dump_major_18": major(pgd) == "18",
              "package_matches_provenance": pkgver == doc["postgresql_client_package_version"],
              "restore_sha_matches_provenance": sha(pgr) == doc["pg_restore_binary_sha256"],
              "dump_sha_matches_provenance": sha(pgd) == doc["pg_dump_binary_sha256"],
              "pg_restore_major_field": doc["pg_restore_major"] == "18",
              "runtime_manifest_present": bool(doc["postgresql_runtime_files"]),
              "runtime_libraries_match_provenance": libs_ok,
              "runtime_manifest_hash_correct": manifest_ok,
              # The app user may EXECUTE the client but MUST NOT be able to modify it (root-owned).
              "app_can_exec_restore": os.access(pgr, os.X_OK),
          }
          try:
              open(pgr, "ab").close(); checks["app_cannot_modify_restore"] = False
          except OSError:
              checks["app_cannot_modify_restore"] = True
          # NO server: postmaster/pg_ctl/initdb/cluster tooling must be absent from image + PATH.
          server_bins = ["postgres", "postmaster", "pg_ctl", "initdb", "pg_ctlcluster",
                         "pg_createcluster", "pg_cluster"]
          checks["no_server_binaries"] = all(
              not os.path.exists(f"{BIN}/{b}") and shutil.which(b) is None for b in server_bins)
          checks["no_cluster_config"] = not os.path.isdir("/etc/postgresql")
          print(json.dumps(checks, indent=2, sort_keys=True))
          sys.exit(0 if all(checks.values()) else 1)
          PY

      - name: Installed closure matches the committed APT lock (§5, inside the image)
        run: docker run --rm cestaplan-image python -m cestaplan_api.provenance.verify_lock
             /app/postgresql-client-18-runtime.lock.json

      - name: Apply migrations from the image (as the app user)
        run: docker run --rm --network host -e DATABASE_URL -e DEPLOYMENT_MODE
             -e AI_BILLING_MODE -e SESSION_SECRET cestaplan-image alembic upgrade head

      - name: pg_restore --list over /proc/self/fd works as the app user (§7 functional)
        run: |
          docker run --rm --network host -e DATABASE_URL cestaplan-image python - <<'PY'
          import os, subprocess, sys
          uri = os.environ["DATABASE_URL"].replace("+psycopg", "")
          # The image's pinned pg_dump 18 captures the live schema; the pinned pg_restore 18 then
          # lists it through /proc/self/fd/<fd> with pass_fds — the exact contract BackupEvidence uses.
          subprocess.run(["pg_dump", "-Fc", "--schema-only", "--dbname", uri, "-f", "/tmp/live.dump"],
                         check=True, capture_output=True, timeout=120)
          fd = os.open("/tmp/live.dump", os.O_RDONLY)
          try:
              os.lseek(fd, 0, os.SEEK_SET)
              r = subprocess.run(["pg_restore", "--list", f"/proc/self/fd/{fd}"],
                                 pass_fds=(fd,), capture_output=True, text=True, check=False)
          finally:
              os.close(fd)
          ok = (r.returncode == 0 and bool(r.stdout)
                and "database version: 18" in r.stdout.lower())
          print("rc", r.returncode, "has_output", bool(r.stdout))
          print(r.stdout[:400])
          sys.exit(0 if ok else 1)
          PY

      - name: VerifiedPgRestore executes the STRICT (root-owned) closure via the held fd (§6/§7)
        run: |
          docker run --rm --network host -e DATABASE_URL -e DEPLOYMENT_MODE=cloud \
            -e AI_BILLING_MODE -e SESSION_SECRET cestaplan-image python - <<'PY'
          import json, os, subprocess, sys
          from cestaplan_api.tools import apply_history_lane_remediation as apply_tool
          uri = os.environ["DATABASE_URL"].replace("+psycopg", "")
          subprocess.run(["pg_dump", "-Fc", "--schema-only", "--dbname", uri, "-f", "/tmp/live.dump"],
                         check=True, capture_output=True, timeout=120)
          doc = json.load(open("/app/build-provenance.json"))
          runtime_files = tuple((fe["path"], fe["sha256"]) for fe in doc["postgresql_runtime_files"])
          # DEPLOYMENT_MODE=cloud => strict gates, NO env override; open the REAL /usr binary and
          # execute it via /proc/self/fd/<pg_restore_fd> with the dump fd (both descriptors passed).
          vpr = apply_tool.open_verified_pg_restore(
              expected_sha256=doc["pg_restore_binary_sha256"], expected_major="18",
              runtime_files=runtime_files, path=apply_tool._pg_restore_operational_path())
          assert vpr is not None, "open_verified_pg_restore returned None in the real image"
          assert vpr.major == "18"
          fd = os.open("/tmp/live.dump", os.O_RDONLY)
          try:
              lst = vpr.run(["--list", f"/proc/self/fd/{fd}"], pass_dump_fd=fd, timeout=60)
          finally:
              os.close(fd)
              vpr.close()
          ok = lst is not None and lst.returncode == 0 and "database version: 18" in lst.stdout.lower()
          print("verified-fd --list rc", None if lst is None else lst.returncode)
          sys.exit(0 if ok else 1)
          PY

      - name: API starts and serves /health (as the app user)
        run: |
          docker run -d --name apitest --network host -e DATABASE_URL -e DEPLOYMENT_MODE \
            -e AI_BILLING_MODE -e SESSION_SECRET -e PORT=8091 cestaplan-image
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8091/health || true)
            [ "$code" = "200" ] && ok=1 && break; sleep 2
          done
          docker logs apitest | tail -20; docker rm -f apitest
          [ "${ok:-0}" = "1" ] || { echo "FAIL: API did not become healthy"; exit 1; }

      - name: Worker imports and starts its loop (as the app user)
        run: |
          set +e
          docker run --rm --network host -e DATABASE_URL -e DEPLOYMENT_MODE -e AI_BILLING_MODE \
            -e SESSION_SECRET cestaplan-image timeout 8 python -m cestaplan_api.jobs.crawl_worker
          rc=$?
          # 124 == still running when timeout fired (healthy loop); 0 == clean exit. Anything else fails.
          [ "$rc" = "124" ] || [ "$rc" = "0" ] || { echo "FAIL: worker exited rc=$rc"; exit 1; }
          echo "worker rc=$rc (ok)"
